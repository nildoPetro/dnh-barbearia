<div id="manageShopModal" class="modal hidden" style="display:none">
  <div class="modal-card" style="max-width:520px;max-height:92vh;overflow-y:auto;background:#161616;border:1px solid #2a2a2a;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 id="manageShopTitle" style="color:#fff;font-size:18px;">Gerenciar Barbearia</h3>
      <button id="mCloseX" style="background:#222;border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;">✕</button>
    </div>
    
    <div style="display:grid;gap:14px;">
      <div class="field"><label>Nome da Barbearia</label><input id="mShopName" placeholder="Ex: DNH Barbearia"></div>
      <div class="field"><label>Slug (link)</label><input id="mShopSlug" disabled><small id="mShopLink" style="color:#d4af37;font-size:11px;"></small></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field"><label>Logo URL</label><input id="mShopLogo" placeholder="dnh-logo.png"></div>
        <div class="field"><label>Ativo?</label><label style="display:flex;align-items:center;gap:8px;margin-top:8px;"><input type="checkbox" id="mShopActive"> Barbearia ativa</label></div>
      </div>
      <div class="field"><label>E-mail do Dono (owner)</label><input id="mShopOwner" type="email" placeholder="dono@email.com"></div>
    </div>

    <hr style="border:none;border-top:1px solid #222;margin:18px 0">

    <h4 style="font-size:14px;margin-bottom:10px;">👥 Admins desta unidade</h4>
    <div id="mShopAdminsList" style="display:grid;gap:8px;max-height:180px;overflow-y:auto;"></div>

    <div style="background:#0f0f0f;padding:14px;border-radius:12px;border:1px solid #d4af3730;margin-top:14px;">
      <b style="font-size:13px;color:#d4af37;">+ Adicionar novo Administrador</b>
      <p style="font-size:11px;color:#888;margin:4px 0 10px;">Será criado login e enviado e-mail para criar senha</p>
      <div style="display:grid;gap:10px;">
        <div class="field"><label>Nome Completo *</label><input id="mNewAdminName" placeholder="Ex: João Silva"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="field"><label>E-mail * (login)</label><input id="mNewAdminEmail" type="email" placeholder="admin@email.com"></div>
          <div class="field"><label>Telefone</label><input id="mNewAdminPhone" placeholder="(21) 99999-9999"></div>
        </div>
        <div class="field"><label>Perfil</label><select id="mNewAdminPerfil"><option value="admin">Admin - Acesso total</option><option value="gerente">Gerente - Sem config</option></select></div>
        <button id="mAddAdminBtn" class="btn gold full" style="margin-top:4px;">✉️ Criar ADM e Enviar Acesso por E-mail</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
      <button id="mCancelBtn" style="background:#222;color:#fff;">Cancelar</button>
      <button id="mSaveBtn" class="btn gold">Salvar Barbearia</button>
    </div>
  </div>
</div>
<style>.field label{font-size:11px;color:#aaa;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}.field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a2a;background:#1e1e1e;color:#fff}</style>
