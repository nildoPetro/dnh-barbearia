<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNH Barbearia</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.superadmin-only{display:none}.admin-only{display:none}.client-only{display:none}</style></head><body><div id="toast" class="toast"></div><div id="authView" class="auth-shell"><div class="auth-card"><img src="dnh-logo.png" class="auth-logo" alt="DNH"><div class="eyebrow">DNH BARBEARIA</div><h1>Seu estilo começa aqui.</h1><div class="auth-tabs"><button class="active" data-auth="login">Entrar</button><button data-auth="signup">Criar conta</button></div><form id="loginForm"><label>E-mail<input id="loginEmail" type="email" required></label><label>Senha<input id="loginPassword" type="password" required></label><button class="btn gold full">Entrar</button></form><form id="signupForm" class="hidden"><label>Nome<input id="signupName" required></label><label>WhatsApp<input id="signupPhone" required></label><label>Nascimento<input id="signupBirth" type="date"></label><label>E-mail<input id="signupEmail" type="email" required></label><label>Senha<input id="signupPassword" type="password" minlength="6" required></label><button class="btn gold full">Criar conta</button></form></div></div><div id="appView" class="hidden"><header class="topbar"><div class="brand"><img id="brandLogo" src="dnh-logo.png"><div><b id="brandName">DNH</b><small id="roleLabel">Gestão</small></div></div><div class="top-actions"><button id="logoutBtn" class="ghost">Sair</button></div></header><div class="layout"><aside class="sidebar"><button class="nav admin-only" data-page="dashboard">⌂ Visão geral</button><button class="nav admin-only" data-page="agenda">▣ Agenda</button><button class="nav client-only" data-page="agenda">▣ Agendar</button><button class="nav client-only" data-page="consultar">🔎 Consultar</button><button class="nav admin-only" data-page="services">✂ Serviços</button><button class="nav admin-only" data-page="clients">♙ Clientes</button><button class="nav admin-only" data-page="stock">▤ Estoque</button><button class="nav admin-only" data-page="finance">R$ Financeiro</button><button class="nav admin-only" data-page="team">♟ Equipe</button><button class="nav admin-only" data-page="settings">⚙ Config</button><button class="nav superadmin-only" data-page="superadmin" style="background:#d4af37;color:#000;margin-top:20px;display:none;">👑 Gestão Barbearias</button></aside><main class="content"><section id="page-superadmin" class="page active"><div class="page-head"><div><span class="eyebrow">SUPER ADMIN - Nildo</span><h2>Gestão de Barbearias</h2><p class="muted">1 projeto, infinitas barbearias. Cada uma com seu link ?b=slug</p></div></div><div class="grid-2"><div class="card"><h3>Nova barbearia</h3><form id="barbershopForm"><label>Slug (sem espaço, ex: barbearia-joao)<input id="shopSlug" required placeholder="barbearia-joao"></label><label>Nome da barbearia<input id="shopName" required placeholder="Barbearia do João"></label><label>Logo URL<input id="shopLogo" placeholder="logo-joao.png"></label><label>Email do dono<input id="shopOwner" type="email"></label><button class="btn gold">Criar barbearia</button></form><p class="muted" style="margin-top:12px;">Preview: <b id="previewLink">seusite.com?b=slug</b></p></div><div class="card"><h3>Barbearias cadastradas</h3><div id="barbershopList" class="list"><p class="muted">Carregando...</p></div></div></div></section><section id="page-dashboard" class="page"><div class="page-head"><div><span class="eyebrow">PAINEL</span><h2>Visão geral</h2><p class="muted" id="currentSlugInfo"></p></div><button class="btn gold" data-admin-new-booking>+ Novo agendamento</button></div><div class="stats"><div class="stat"><small>Hoje</small><b id="kToday">0</b></div><div class="stat"><small>Clientes</small><b id="kClients">0</b></div><div class="stat"><small>Faturamento</small><b id="kRevenue">R$ 0</b></div></div></section><section id="page-agenda" class="page"><div id="clientAgenda"></div><div id="adminAgenda" class="hidden"></div></section><section id="page-consultar" class="page"><div id="clientBookingsList" class="list"></div></section><section id="page-services" class="page"><div id="serviceList" class="list"></div></section><section id="page-clients" class="page"><div id="clientList"></div></section><section id="page-stock" class="page"><div id="stockList" class="list"></div></section><section id="page-finance" class="page"><div id="financeList" class="list"></div></section><section id="page-team" class="page"><div id="teamList" class="list"></div></section><section id="page-settings" class="page"><div id="shareUrl"></div><div id="weeklyBox"></div></section></main></div></div><script src="config.js"></script><script src="app.js"></script></body></html>
