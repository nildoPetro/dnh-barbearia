<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Barbeiro - DNH</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--gold:#d4af37;--bg:#0a0a0f;--card:#151a28;--border:#1e2230;--text:#8a8fa3}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:Inter,system-ui}.hidden{display:none!important}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:10px;color:var(--text);text-transform:uppercase}.field input,.field select{background:#0a0e1a;border:1px solid var(--border);color:#fff;padding:12px;border-radius:10px;width:100%}.btn{background:#1e2230;border:1px solid var(--border);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer}.btn.gold{background:var(--gold);color:#000;font-weight:700}.btn.small{padding:6px 10px;font-size:12px}.btn.success{background:#4ade80;color:#000}.list-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);padding:12px;border-radius:10px;margin-bottom:8px;gap:10px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;right:20px;background:#111525;border:1px solid var(--gold);padding:14px;border-radius:10px;transform:translateY(100px);opacity:0;transition:.3s;z-index:999}.toast.show{transform:translateY(0);opacity:1}</style></head><body>
<div id="loginBarbeiro" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px"><div style="background:#111525;border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:380px;text-align:center"><h2 style="color:var(--gold)">💈 Acesso Barbeiro</h2><div class="field" style="text-align:left;margin-top:16px"><label>Barbearia (slug)</label><input id="bSlug" value="dnh"></div><div class="field" style="text-align:left"><label>Selecione seu nome</label><select id="bNome"></select></div><div class="field" style="text-align:left"><label>Seu Telefone (senha)</label><input id="bPhone" placeholder="(11) 99999-9999"></div><button id="btnLoginB" class="btn gold" style="width:100%;padding:14px">Entrar</button><small style="color:var(--text);display:block;margin-top:10px">Use telefone cadastrado no admin em Funcionários</small></div></div>
<div id="appBarbeiro" class="hidden" style="padding:16px;max-width:900px;margin:0 auto">
<div style="display:flex;justify-content:space-between;align-items:center"><div><h1 style="color:var(--gold)" id="barbeiroNome">Olá</h1><small id="barbeiroInfo" style="color:var(--text)"></small></div><button id="btnLogoutB" class="btn small">Sair</button></div>
<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button data-tab="hoje" class="btn gold small tab active">Hoje</button><button data-tab="semana" class="btn small tab">Semana</button><button data-tab="mes" class="btn small tab">Mês</button><button data-tab="intervalo" class="btn small tab">Intervalo</button><button data-tab="comissao" class="btn small tab" style="border-color:#4ade80;color:#4ade80">💸 Minha Comissão</button></div>
<div id="boxIntervalo" class="hidden" style="margin-top:12px;display:flex;gap:8px"><input id="intInicio" type="date"><input id="intFim" type="date"><button id="btnFiltrarInt" class="btn gold small">Filtrar</button></div>
<div id="resumoBarbeiro" style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"></div>
<div id="listaBarbeiro" style="margin-top:16px"></div>
<div id="boxComissao" class="hidden" style="margin-top:16px"><div id="resumoComissaoB"></div><div id="listaComissaoB" style="margin-top:12px"></div></div>
</div>
<script src="config.js"></script><script src="barbeiro.js"></script></body></html>
