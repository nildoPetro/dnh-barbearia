<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agendar - Barbearia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--gold:#d4af37;--bg:#0a0a0f;--card:#151a28;--border:#1e2230;--text:#8a8fa3}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:Inter,system-ui}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.btn{background:var(--gold);color:#000;border:none;padding:14px;border-radius:10px;font-weight:800;cursor:pointer;width:100%}.field{margin-bottom:12px;display:flex;flex-direction:column;gap:6px}.field label{font-size:10px;color:var(--text);text-transform:uppercase}.field input,.field select{background:#0a0e1a;border:1px solid var(--border);color:#fff;padding:12px;border-radius:10px;width:100%}</style></head><body>
<div style="max-width:500px;margin:0 auto;padding:16px"><div style="text-align:center"><img id="logoCliente" src="/dnh-logo.png" style="width:90px;height:90px;border-radius:20px;border:2px solid var(--gold);object-fit:cover;display:none"><h1 id="nomeBarbearia" style="color:var(--gold);margin:10px 0 4px">BARBEARIA</h1><small id="slugInfo" style="color:var(--text)"></small></div>
<div class="card" style="margin-top:16px"><h3>📅 Agendar Horário</h3><div class="field" style="margin-top:12px"><label>Data</label><input id="cliData" type="date"></div><div class="field"><label>Barbeiro</label><select id="cliBarbeiro"></select></div><div class="field"><label>Serviço</label><select id="cliServico"></select></div><div class="field"><label>Horários Disponíveis</label><div id="cliHorarios" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div></div><div class="field"><label>Seu Nome</label><input id="cliNome" placeholder="Seu nome"></div><div class="field"><label>Telefone / WhatsApp</label><input id="cliPhone" placeholder="(11) 99999-9999"></div><button id="btnAgendarCli" class="btn">Confirmar Agendamento</button><small id="msgCli" style="color:#4ade80;display:block;margin-top:10px;text-align:center"></small></div>
<div style="text-align:center;margin-top:16px"><a id="linkAdminCli" href="#" style="color:var(--text);font-size:12px">Acesso Admin</a></div>
</div>
<script src="/config.js"></script><script src="/cliente.js"></script></body></html>
