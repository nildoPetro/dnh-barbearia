<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui} input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #222;background:#0f1420;color:#fff;box-sizing:border-box} label{display:block;margin:12px 0 4px;font-size:12px;opacity:.7}</style>
</head><body>
<div style="max-width:500px;margin:0 auto;padding:16px;width:100%;box-sizing:border-box">
  <div style="background:#0f1420;border:1px solid #222;border-radius:16px;padding:16px;text-align:center">
    <img id="logoCliente" style="width:80px;height:80px;border-radius:14px;object-fit:cover;display:none;margin:0 auto 8px">
    <h2 id="nomeBarbearia" style="color:#d4af37;margin:0">Carregando...</h2>
    <small id="slugInfo" style="opacity:.6"></small>
  </div>
  <div style="background:#0f1420;border:1px solid #222;border-radius:16px;padding:16px;margin-top:12px">
    <label>DATA</label><input id="cliData" type="date">
    <label>BARBEIRO</label><select id="cliBarbeiro"></select>
    <label>SERVIÇO</label><select id="cliServico"></select>
    <label>HORÁRIOS</label><div id="cliHorarios" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    <label>SEU NOME</label><input id="cliNome" placeholder="Ex: João Silva">
    <label>TELEFONE / WHATSAPP</label><input id="cliPhone" placeholder="(21) 99999-9999">
    <label>DATA DE NASCIMENTO (opcional - pra ganhar desconto no seu aniversário 🎂)</label>
    <input id="cliNascimento" type="date">
    <small style="opacity:.6">Se preencher, no seu aniversário você ganha um mimo/desconto. Não é obrigatório.</small>
    <button id="btnAgendarCli" style="width:100%;padding:14px;margin-top:16px;border:0;border-radius:12px;background:#d4af37;font-weight:800;cursor:pointer">Confirmar Agendamento</button>
    <div id="msgCli" style="margin-top:10px;text-align:center;color:#4ade80"></div>
    <div style="text-align:center;margin-top:12px"><a id="linkAdminCli" href="#" style="color:#888;font-size:12px">Área do Admin</a></div>
  </div>
</div>
<script src="/cliente.js"></script>
</body></html>
