<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbearia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui} .box{max-width:420px;margin:0 auto;padding:24px;text-align:center} .btn{display:block;width:100%;padding:16px;margin:10px 0;border-radius:12px;border:1px solid #d4af37;background:#111;color:#fff;font-size:16px;cursor:pointer;text-decoration:none;box-sizing:border-box} .btn-gold{background:#d4af37;color:#000;font-weight:800} .card{background:#0f1420;border:1px solid #222;border-radius:16px;padding:20px}</style>
</head><body><div class="box"><div class="card">
<img id="logoHub" style="width:90px;height:90px;border-radius:16px;object-fit:cover;display:none;margin:0 auto 12px">
<h1 id="nomeHub" style="color:#d4af37;margin:0">Carregando...</h1>
<p id="slugHub" style="opacity:.6"></p>
<a id="btnCliente" class="btn btn-gold" href="#">✂️ Quero Agendar um Horário</a>
<p style="font-size:12px;opacity:.6">Sem login, só nome, telefone e nascimento (opcional)</p>
<a id="btnBarbeiro" class="btn" href="#">💈 Sou Barbeiro</a>
<a id="btnAdmin" class="btn" href="#">🔐 Sou Admin</a>
</div></div>
<script>
const slug = location.pathname.split('/').filter(Boolean)[0] || 'dnh';
const sb = supabase.createClient(window.DNH_CONFIG.supabaseUrl, window.DNH_CONFIG.supabaseAnonKey);
document.getElementById('slugHub').textContent = '/'+slug;
document.getElementById('btnCliente').href = '/'+slug+'/cliente.html';
document.getElementById('btnBarbeiro').href = '/'+slug+'/barbeiro.html';
document.getElementById('btnAdmin').href = '/'+slug+'/admin.html';
(async()=>{
  const {data}=await sb.from('settings').select('*').eq('slug',slug).maybeSingle();
  if(data){document.getElementById('nomeHub').textContent=data.name||slug; if(data.logo_url){const i=document.getElementById('logoHub');i.src=data.logo_url;i.style.display='block';}}
})();
</script></body></html>
