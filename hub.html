<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hub - Barbearia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:Inter,system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#111525;border:1px solid #1e2230;border-radius:20px;padding:28px;width:100%;max-width:420px;text-align:center}
.logo{width:90px;height:90px;border-radius:20px;object-fit:cover;border:2px solid #d4af37;background:#000;margin:0 auto 12px;display:block}
h1{color:#d4af37;font-size:24px}small{color:#8a8fa3}
.btn{display:block;width:100%;padding:16px;border-radius:12px;text-decoration:none;font-weight:700;margin-top:12px;font-size:16px}
.btn-cliente{background:#d4af37;color:#000}
.btn-barbeiro{background:#1e2230;color:#fff;border:1px solid #1e2230}
.btn-admin{background:transparent;color:#8a8fa3;border:1px solid #1e2230;font-size:13px}
</style></head><body>
<div class="card">
<img id="hubLogo" class="logo" src="/dnh-logo.png" onerror="this.style.display='none'">
<h1 id="hubName">BARBEARIA</h1>
<small id="hubSlug">carregando...</small>
<p style="margin:16px 0;color:#8a8fa3">Escolha como entrar:</p>
<a id="linkCliente" class="btn btn-cliente" href="#">📅 Sou Cliente - Agendar Horário</a>
<a id="linkBarbeiro" class="btn btn-barbeiro" href="#">💈 Sou Barbeiro</a>
<a id="linkAdmin" class="btn btn-admin" href="#">⚙️ Sou Admin</a>
</div>
<script src="/config.js"></script>
<script>
let slug='dnh';
let parts=location.pathname.split('/').filter(Boolean);
if(parts.length>=1 && parts[0].indexOf('.html')===-1){ slug=parts[0]; }
else { slug=localStorage.getItem('dnh_slug')||'dnh'; }
localStorage.setItem('dnh_slug',slug);
document.getElementById('hubSlug').textContent=slug;
document.getElementById('linkCliente').href='/' + slug + '/cliente.html';
document.getElementById('linkBarbeiro').href='/' + slug + '/barbeiro.html';
document.getElementById('linkAdmin').href='/' + slug + '/admin.html';
async function loadShop(){
  try{
    if(window.supabase && window.DNH_CONFIG){
      let sb=window.supabase.createClient(window.DNH_CONFIG.supabaseUrl, window.DNH_CONFIG.supabaseAnonKey);
      let r=await sb.from('barbershops').select('*').eq('slug',slug).single();
      if(r.data){
        if(r.data.name) document.getElementById('hubName').textContent=r.data.name.toUpperCase();
        if(r.data.logo_url) document.getElementById('hubLogo').src=r.data.logo_url;
      }
    }
  }catch(e){ console.log(e); }
}
loadShop();
</script></body></html>
