<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hub - Barbearia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--gold:#d4af37;--bg:#0a0a0f;--card:#151a28;--border:#1e2230;--text:#8a8fa3}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:Inter,system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#111525;border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:420px;text-align:center}.btn{display:block;width:100%;padding:16px;border-radius:12px;border:1px solid var(--border);margin-top:12px;cursor:pointer;font-weight:700;font-size:15px;text-decoration:none}.btn.gold{background:var(--gold);color:#000}.btn.dark{background:#1e2230;color:#fff}</style></head><body><div class="card"><img id="logoHub" src="/dnh-logo.png" style="width:90px;height:90px;border-radius:20px;border:2px solid var(--gold);object-fit:cover;margin:0 auto 12px;display:block" onerror="this.style.display='none'"><h2 id="shopNameHub" style="color:var(--gold)">DNH BARBEARIA</h2><small id="slugHub" style="color:var(--text)">dnh</small><a class="btn gold" id="linkCliente" href="cliente.html">✂️ Quero Agendar um Horário</a><a class="btn dark" id="linkBarbeiro" href="barbeiro.html">💈 Sou Barbeiro</a><a class="btn dark" id="linkAdmin" href="admin.html">🔐 Sou Admin</a></div><script src="/config.js"></script><script>const slug=location.pathname.split('/').filter(Boolean)[0]||'dnh';document.getElementById('slugHub').textContent=slug;const base='/'+slug;document.getElementById('linkCliente').href=base+'/cliente.html';document.getElementById('linkBarbeiro').href=base+'/barbeiro.html';document.getElementById('linkAdmin').href=base+'/admin.html';(async()=>{try{const c=supabase.createClient(window.DNH_CONFIG.supabaseUrl,window.DNH_CONFIG.supabaseAnonKey);const {data}=await c.from('barbershops').select('name,logo_url').eq('slug',slug).single();if(data){if(data.name)document.getElementById('shopNameHub').textContent=data.name.toUpperCase();if(data.logo_url)document.getElementById('logoHub').src=data.logo_url;}})catch(e){}})();</script></body></html>
